# ================================================================
# tracked_diff_drive_controller.yaml
# 履带机器人 ros2_control 差速配置（每侧 4 轮同步驱动）
#
# 控制器:
#   joint_state_broadcaster  — 发布 /joint_states
#   diff_drive_controller    — 订阅 /cmd_vel, 发布 /odom_diff_drive
# ================================================================

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

# ----------------------------------------------------------------
# 差速驱动控制器参数
# ----------------------------------------------------------------
diff_drive_controller:
  ros__parameters:
    left_wheel_names:
      - left_wheel_1_joint
      - left_wheel_2_joint
      - left_wheel_3_joint
      - left_wheel_4_joint
    right_wheel_names:
      - right_wheel_1_joint
      - right_wheel_2_joint
      - right_wheel_3_joint
      - right_wheel_4_joint

    wheel_separation: 0.36     # 左右轮心距 (m)，与 tracked_robot.xacro 一致
    wheel_radius: 0.05         # 承重轮半径 (m)

    left_wheel_radius_multiplier:  1.0
    right_wheel_radius_multiplier: 1.0

    use_stamped_vel: false
    cmd_vel_timeout: 0.5

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]

    open_loop: true
    enable_odom_tf: false

    linear.x.has_velocity_limits:     true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity:     0.5
    linear.x.min_velocity:    -0.5
    linear.x.max_acceleration: 0.6
    linear.x.min_acceleration: -0.6

    angular.z.has_velocity_limits:     true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity:     0.8
    angular.z.min_velocity:    -0.8
    angular.z.max_acceleration: 1.0
    angular.z.min_acceleration: -1.0

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 100.0
