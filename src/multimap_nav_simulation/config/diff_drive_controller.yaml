# ================================================================
# diff_drive_controller.yaml
# ros2_control 差速驱动控制器配置
#
# 控制器:
#   joint_state_broadcaster  — 发布 /joint_states
#   diff_drive_controller    — 订阅 cmd_vel, 发布 odom
# ================================================================

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # --- 注册的控制器 ---
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

# ----------------------------------------------------------------
# 差速驱动控制器参数
# ----------------------------------------------------------------
diff_drive_controller:
  ros__parameters:
    # --- 轮子配置 ---
    left_wheel_names:  ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 1.38     # 左右轮距 (m)（机器人 3 倍缩放后）
    wheel_radius: 0.225        # 驱动轮半径 (m)（机器人 3 倍缩放后）

    # 如果 left_wheel 物理上反向安装，设置 true
    left_wheel_radius_multiplier:  1.0
    right_wheel_radius_multiplier: 1.0

    # --- 话题配置 ---
    use_stamped_vel: false     # 订阅 geometry_msgs/Twist 而不是 TwistStamped
    cmd_vel_timeout: 0.5       # 指令超时 (s)

    # 里程计
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]

    # 开环控制模式（仿真推荐）
    open_loop: true
    # 关闭里程计 TF: 机器人的位姿 TF 由 FAST-LIO (lidar → base_link) 提供，
    # 避免 odom → base_link 与 LIO 的 TF 冲突（base_link 双父断裂）。
    enable_odom_tf: false

    # --- 线速度和角速度限制 ---
    linear.x.has_velocity_limits:    true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity:    1.0    # m/s
    linear.x.min_velocity:   -1.0
    linear.x.max_acceleration: 1.5   # m/s^2
    linear.x.min_acceleration: -1.5

    angular.z.has_velocity_limits:    true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity:    2.0    # rad/s
    angular.z.min_velocity:   -2.0
    angular.z.max_acceleration: 3.0   # rad/s^2
    angular.z.min_acceleration: -3.0

# ----------------------------------------------------------------
# Joint State Broadcaster 参数
# ----------------------------------------------------------------
joint_state_broadcaster:
  ros__parameters:
    publish_rate: 100.0
