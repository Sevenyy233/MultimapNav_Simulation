# Ideal relative odometry/velocity from Gazebo; final pose is estimated by NDT-ESKF.
localization_server:
  ros__parameters:
    use_sim_time: true
    publish_identity_map_to_odom: false
    costmap2d_localization:
      use_ndt: true
      use_odom: true
      odom_is_map_frame: false
      odom_topic: /truth/odometry
      use_wheel_velocity: false
      odom_velocity_mode: body_3d
      odom_velocity_noise: 0.01
      use_odom_rotation_guess: true
      odom_timeout: 0.5
      use_map_visibility: true
      use_ground_support_prior: true
      icp_refinement: true
    gridmap_localization:
      use_ndt: true
      use_odom: true
      odom_is_map_frame: false
      odom_topic: /truth/odometry
      use_wheel_velocity: false
      odom_velocity_mode: body_3d
      odom_velocity_noise: 0.01
      use_odom_rotation_guess: true
      odom_timeout: 0.5
      use_map_visibility: true
      use_ground_support_prior: true
      icp_refinement: true
    octomap_localization:
      use_ndt: true
      use_odom: true
      odom_is_map_frame: false
      odom_topic: /truth/odometry
      use_wheel_velocity: false
      odom_velocity_mode: body_3d
      odom_velocity_noise: 0.01
      use_odom_rotation_guess: true
      odom_timeout: 0.5
      use_map_visibility: true
      use_ground_support_prior: true
      icp_refinement: true
trajectory_planner_server:
  ros__parameters:
    goal_position_tolerance: 0.15
    goal_yaw_tolerance: 0.15
    costmap2d_trajectory_planner:
      goal_position_tolerance: 0.15
      goal_yaw_tolerance: 0.15
      min_in_place_angular_vel: 0.45
    gridmap_trajectory_planner:
      goal_position_tolerance: 0.15
      goal_yaw_tolerance: 0.15
      min_in_place_angular_vel: 0.45
    octomap_trajectory_planner:
      goal_position_tolerance: 0.15
      goal_yaw_tolerance: 0.15
      min_in_place_angular_vel: 0.45
bt_navigator:
  ros__parameters:
    goal_position_tolerance: 0.15
    goal_yaw_tolerance: 0.15
local_planner_server:
  ros__parameters:
    scan_local_planner:
      sensor_min_range: 0.4
      sensor_self_filter_radius: 0.35
      sensor_ground_tolerance: 0.08
      sensor_obstacle_min_height: -0.1
      sensor_subtract_static_map: false
      obstacle_cloud_topic: /obstacle_cloud
lifecycle_manager:
  ros__parameters:
    profiles:
      costmap2d:
        goal_position_tolerance: 0.15
        goal_yaw_tolerance: 0.15
      gridmap:
        goal_position_tolerance: 0.15
        goal_yaw_tolerance: 0.15
      octomap:
        goal_position_tolerance: 0.15
        goal_yaw_tolerance: 0.15
