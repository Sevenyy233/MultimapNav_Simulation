# ================================================================
# octomap_mapping.yaml — octomap_server 建图参数（工作区源码包版）
#
# 对应启动文件: launch/octomap_mapping.launch.py
# 使用的包    : src/octomap_mapping/octomap_server（OctoMap/octomap_mapping v2.3.1）
#               本地 colcon 构建的 octomap_server_node / octomap_saver_node
# 默认输入话题: /livox/lidar_PointCloud2 (sensor_msgs/PointCloud2)
#               由 ros2_livox_simulation 的 Avia 插件随 /livox/lidar 发布
# 固定坐标系  : odom
#   TF 链     : odom ─odom_tf_broadcaster(p3d 真值)─> base_link ─URDF─> avia
#   gazebo_sim.launch.py 已自带该 TF，建图前只需启动仿真，无需 FAST-LIO
#   由于 avia 安装在 base_link 前方 x=0.84m、上方 z=0.57m 并向下倾斜约 20°，
#   且只看前方扇区，地图在 RViz 中
#   视觉上更偏向机器人前半部是正常现象，并非坐标系错误。
#
# 可视化覆盖范围（判断哪些地方没扫到）:
#   RViz Fixed Frame 设为 odom，添加以下显示:
#     - OctoMap 插件  订阅 /octomap_full  (占据+空闲体素，半透明)
#     - MarkerArray   订阅 /occupied_cells_vis_array  (障碍=彩色/红色)
#     - MarkerArray   订阅 /free_cells_vis_array      (扫过但为空=绿色)
#     - PointCloud2   订阅 /octomap_point_cloud_centers (占据格心=点云痕迹)
#     - PointCloud2   订阅 /livox/lidar_PointCloud2    (当前帧点云)
#   有绿色体素=扫过且为空; 红/彩色体素=障碍; 完全空白=未扫到(未知)。
#
# 保存地图    : 建图完成后运行
#   ros2 launch multimap_nav_simulation save_octomap.launch.py \
#       octomap_path:=/tmp/map.ot
# 注意(分辨率与地面层):
#   octomap 中"地面层"的厚度 = resolution。机器人已放大为原尺寸 3 倍：
#   底盘底面(base_link z)离地约 0.12m。0.1m 分辨率的地面占据层 z∈[0, 0.1]m
#   完全在底盘底面之下，栅格贴住轮子触地点，RViz 中不会切到车身，导航
#   规划起点(z≈0.12m 以上)也不会落进地面层。
# 注意        : 不要同时启动 fastlio2_mid360（其 lidar→base_link 会与
#               odom_tf_broadcaster 的 odom→base_link 形成 base_link 双父冲突）
# ================================================================

octomap_server:
  ros__parameters:

    # --- 地图基本参数 ---
    resolution: 0.1             # 体素分辨率 [m]（见文件头"分辨率与地面层"说明；
                                #  机器人 5 倍后底盘底面 0.2m > 地面层 0.1m）
    z_offset: -0.05             # 点云插入前的 z 偏移 [m]：取 -resolution/2，
                                # 让地面体素层下移半格、顶面贴住真实地面(z=0)，
                                # 轮子不再陷入栅格（改分辨率时需同步改此值）
    frame_id: odom              # 建图固定坐标系（若以后接 SLAM/定位则建议改为 map）
    base_frame_id: base_link    # 机器人基座坐标系（可选地面滤波需要）

    # --- 传感器模型（概率占据）---
    sensor_model.max_range: 30.0   # 最大融合距离 [m]（与 mid360_lio.yaml 的 lidar_max_range 一致）
    sensor_model.hit: 0.7          # 命中占用概率
    sensor_model.miss: 0.4         # 未命中空闲概率
    sensor_model.min: 0.12         # 最小占用概率
    sensor_model.max: 0.97         # 最大占用概率

    # --- 点云预处理（坐标相对 frame_id）---
    point_cloud_min_x: -100.0
    point_cloud_max_x: 100.0
    point_cloud_min_y: -100.0
    point_cloud_max_y: 100.0
    point_cloud_min_z: -2.0        # 滤掉地面以下的无效点
    point_cloud_max_z: 1.8         # 默认只保留中低位障碍，滤掉房间上缘/墙顶回波
    occupancy_min_z: -2.0          # 最终地图保留的 z 范围
    occupancy_max_z: 1.8           # 与 point_cloud_max_z 配套，避免高处体素继续显示
    filter_speckles: true          # 过滤孤立噪点
    # 保留地面：MultiMapNav 需要完整地形，地面必须进图。
    # 静止建图时向下射线会在未扫到的地面上留下"圆环"；
    # 建图时让机器人走遍整个区域，圆环会被填成完整地面，无残留。
    filter_ground_plane: false

    # --- 发布与压缩 ---
    compress_map: true
    latch: true                    # 地图话题按 latch 发布，RViz 可直接查看
    publish_free_space: true       # 发布空闲空间（绿色体素=扫过但为空），
                                   # 用于直观区分"已扫描"与"未扫描(空白)";
                                   # 若 RViz 卡顿可改回 false 减小消息量
    use_height_map: false
    colored_map: false
    max_depth: 16                  # 发布/服务输出的最大八叉树深度（16=全分辨率）

    # --- 可选：启动时加载已有地图（留空/注释则从空图开始建）---
    # octomap_path: "/tmp/map.ot"
