# ================================================================
# avia_lio.yaml — FAST-LIO2 Avia 专用配置
#
# 基于: FASTLIO2_ROS2/fastlio2/config/lio.yaml
# 适配: multimap_nav_simulation Gazebo 仿真（Avia 雷达 + IMU）
#
# 外参: Avia (avia) 相对 body (IMU 系) 的外参
#   URDF 安装（robot.xacro）:
#     base_link → avia:     xyz="0.84 0 0.57" rpy="0 0.35 0"（绕 Y 向下倾斜 0.35rad）
#     base_link → imu_link: xyz="0 0 0.18"  rpy="0 0 0"
#   FAST-LIO 的 body 系即 IMU 系，雷达系→IMU 系:
#     p_imu = R_y(0.35) * p_avia + [0.84, 0, 0.57 - 0.18]
#   → r_il = Ry(0.35) = [cos 0 sin; 0 1 0; -sin 0 cos], cos=0.939, sin=0.343
#   → t_il = [0.84, 0, 0.39]   （z = 0.57 - 0.18，含 IMU 安装偏移）
#
# 话题:
#   /livox/lidar  — livox_ros_driver2/CustomMsg（avia_plugin 直发）
#   /livox/imu    — sensor_msgs/Imu
# ================================================================

imu_topic: /livox/imu
lidar_topic: /livox/lidar
body_frame: base_link
world_frame: lidar
print_time_cost: false
imu_acc_scale: 1.0           # 1.0 for Gazebo sim; 10.0 for real Livox IMU

lidar_filter_num: 6
lidar_min_range: 0.5
lidar_max_range: 30.0
scan_resolution: 0.15
map_resolution: 0.3

cube_len: 300
det_range: 60
move_thresh: 1.5

na: 0.01
ng: 0.01
nba: 0.0001
nbg: 0.0001

imu_init_num: 20
near_search_num: 5
ieskf_max_iter: 5

gravity_align: true
esti_il: false

# Avia 相对 body（IMU 系）的外参
# avia 在 base_link 正前方 0.84m、上方 0.57m，绕 Y 倾斜 0.35rad；
# IMU 在 base_link 系 (0, 0, 0.18)。雷达系→IMU 系平移 z = 0.57 - 0.18 = 0.39。
# r_il = Ry(0.35) = [cos 0 sin; 0 1 0; -sin 0 cos], cos=0.939, sin=0.343
r_il: [0.939, 0.0, 0.343,
       0.0, 1.0, 0.0,
       -0.343, 0.0, 0.939]
t_il: [0.84, 0.0, 0.39]

lidar_cov_inv: 1000.0
