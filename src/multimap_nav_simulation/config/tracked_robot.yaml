# Parameters for robot/tracked_robot.xacro and launch/tracked_robot.launch.py.
controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
diff_drive_controller:
  ros__parameters:
    left_wheel_names:
    - left_wheel_1_joint
    - left_wheel_2_joint
    - left_wheel_3_joint
    - left_wheel_4_joint
    right_wheel_names:
    - right_wheel_1_joint
    - right_wheel_2_joint
    - right_wheel_3_joint
    - right_wheel_4_joint
    wheel_separation: 0.36
    wheel_radius: 0.05
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    use_stamped_vel: false
    cmd_vel_timeout: 0.5
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal:
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    twist_covariance_diagonal:
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    open_loop: true
    enable_odom_tf: false
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 2.0
    linear.x.min_velocity: -2.0
    linear.x.max_acceleration: 0.6
    linear.x.min_acceleration: -0.6
    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 1.2
    angular.z.min_velocity: -1.2
    angular.z.max_acceleration: 1.8
    angular.z.min_acceleration: -1.8
joint_state_broadcaster:
  ros__parameters:
    publish_rate: 100.0
localization_server:
  ros__parameters:
    use_sim_time: true
    publish_identity_map_to_odom: false
    costmap2d_localization:
      use_ndt: true
      use_odom: true
      odom_is_map_frame: false
      odom_topic: /truth/odometry
      use_wheel_velocity: false
      odom_velocity_mode: body_3d
      odom_velocity_noise: 0.01
      use_odom_rotation_guess: true
      odom_timeout: 0.5
      use_map_visibility: true
      use_ground_support_prior: true
      icp_refinement: true
    gridmap_localization:
      use_ndt: true
      use_odom: true
      odom_is_map_frame: false
      odom_topic: /truth/odometry
      use_wheel_velocity: false
      odom_velocity_mode: body_3d
      odom_velocity_noise: 0.01
      use_odom_rotation_guess: true
      odom_timeout: 0.5
      use_map_visibility: true
      use_ground_support_prior: true
      icp_refinement: true
    octomap_localization:
      use_ndt: true
      use_odom: true
      odom_is_map_frame: false
      odom_topic: /truth/odometry
      use_wheel_velocity: false
      odom_velocity_mode: body_3d
      odom_velocity_noise: 0.01
      use_odom_rotation_guess: true
      odom_timeout: 0.5
      use_map_visibility: true
      use_ground_support_prior: true
      icp_refinement: true
trajectory_planner_server:
  ros__parameters:
    goal_position_tolerance: 0.15
    goal_yaw_tolerance: 0.15
    costmap2d_trajectory_planner:
      goal_position_tolerance: 0.15
      goal_yaw_tolerance: 0.15
      min_in_place_angular_vel: 0.45
    gridmap_trajectory_planner:
      goal_position_tolerance: 0.15
      goal_yaw_tolerance: 0.15
      min_in_place_angular_vel: 0.45
    octomap_trajectory_planner:
      goal_position_tolerance: 0.15
      goal_yaw_tolerance: 0.15
      min_in_place_angular_vel: 0.45
bt_navigator:
  ros__parameters:
    goal_position_tolerance: 0.15
    goal_yaw_tolerance: 0.15
local_planner_server:
  ros__parameters:
    scan_local_planner:
      sensor_min_range: 0.4
      sensor_self_filter_radius: 0.35
      sensor_ground_tolerance: 0.08
      sensor_obstacle_min_height: -0.1
      sensor_subtract_static_map: false
      obstacle_cloud_topic: /obstacle_cloud
lifecycle_manager:
  ros__parameters:
    profiles:
      costmap2d:
        goal_position_tolerance: 0.15
        goal_yaw_tolerance: 0.15
      gridmap:
        goal_position_tolerance: 0.15
        goal_yaw_tolerance: 0.15
      octomap:
        goal_position_tolerance: 0.15
        goal_yaw_tolerance: 0.15
