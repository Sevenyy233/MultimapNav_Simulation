# Parameters for robot/tracked_robot.xacro and launch/tracked_robot.launch.py.
controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
diff_drive_controller:
  ros__parameters:
    left_wheel_names:
    - left_wheel_1_joint
    - left_wheel_2_joint
    - left_wheel_3_joint
    - left_wheel_4_joint
    right_wheel_names:
    - right_wheel_1_joint
    - right_wheel_2_joint
    - right_wheel_3_joint
    - right_wheel_4_joint
    wheel_separation: 0.36
    wheel_radius: 0.05
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    use_stamped_vel: false
    cmd_vel_timeout: 0.5
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal:
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    twist_covariance_diagonal:
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    open_loop: true
    enable_odom_tf: false
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 2.0
    linear.x.min_velocity: -2.0
    linear.x.max_acceleration: 0.6
    linear.x.min_acceleration: -0.6
    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 1.2
    angular.z.min_velocity: -1.2
    angular.z.max_acceleration: 1.8
    angular.z.min_acceleration: -1.8
joint_state_broadcaster:
  ros__parameters:
    publish_rate: 100.0
