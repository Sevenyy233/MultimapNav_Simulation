# ================================================================
# pgo_avia.yaml — PGO 全局优化建图配置（Avia 仿真专用）
#
# 基于: FASTLIO2_ROS2/pgo/config/pgo.yaml
# 适配: multimap_nav_simulation Gazebo 仿真（Avia 雷达 + FAST-LIO2）
#
# 输入:
#   /fastlio2/body_cloud — lio_node 发布的 body 系点云 (sensor_msgs/PointCloud2)
#   /fastlio2/lio_odom   — lio_node 发布的里程计 (nav_msgs/Odometry)
#
# 输出:
#   map → lidar TF（优化后全局位姿）
#   /pgo/loop_markers    — 回环检测可视化
#   /pgo/save_maps       — 保存优化后地图的服务
#
# TF 树:
#   map ─pgo─> lidar ─fastlio2─> base_link ─URDF─> avia / imu_link / 轮子
#
# 说明:
#   loop_time_tresh 从 60s 调为 30s：仿真中回环时间差按仿真秒计，
#   30s 内回到起点即可触发回环检测，加快收敛。
# ================================================================

cloud_topic: /fastlio2/body_cloud
odom_topic: /fastlio2/lio_odom
map_frame: map
local_frame: lidar

key_pose_delta_deg: 10
key_pose_delta_trans: 0.5
loop_search_radius: 1.0
loop_time_tresh: 30.0
loop_score_tresh: 0.15
loop_submap_half_range: 5
submap_resolution: 0.1
min_loop_detect_duration: 5.0
