# 节点名下直接使用 launch_ros 参数字典。三个模式共用同一定位质量门。
localization_server:
  initial_pose: [0.0, 0.0, 0.03, 0.0, 0.0, 0.0, 1.0]
  initial_pose_is_hint: true
  prefer_restored_pose: false
  publish_identity_map_to_odom: false
  octomap_localization: &localizer
    map_cloud_topic: /static_map_cloud
    cloud_topic: /points_raw
    reliable_cloud: true
    imu_topic: /livox/imu_raw
    odom_topic: /odom
    use_odom: true
    use_ndt: true
    use_lio_prediction: true
    use_wheel_velocity: false
    odom_velocity_mode: none
    odom_is_map_frame: false
    use_odom_rotation_guess: true
    relocalization_enabled: true
    global_relocalization: true
    relocalization_interval: 1.0
    relocalization_radius: 6.0
    relocalization_yaw_range: 3.15
    relocalization_max_correction_pos: 8.0
    relocalization_max_correction_rot: 3.15
    max_registration_outage: 2.0
    lost_trigger_timeout: 1.5
    min_registration_overlap: 0.45
    health_good_score: 0.025
    health_bad_score: 0.12
    relocalization_good_score: 0.075
    max_range: 40.0
    scan_voxel_size: 0.40
    use_map_visibility: false
    initialize_lio_height_from_support: true
    use_lio_support_height: false
    use_ground_support_prior: false
    restore_last_pose: false
  costmap2d_localization: *localizer
  gridmap_localization: *localizer
map_server:
  costmap2d_map:
    resolution: 0.35
    tire_length: 0.60
    tire_width: 0.50
    max_slope: 0.30
    max_step_height: 0.25
  gridmap_map:
    resolution: 0.35
    robot_height: 4.30
    max_slope: 0.30
    max_step_height: 0.25
  octomap_map:
    resolution: 0.25
global_planner_server:
  path_reuse_enabled: false
  cubic_bezier_smoothing_enabled: false
  costmap2d_global_planner: &astar
    robot_length: 9.9
    robot_width: 3.9
    robot_x_offset: 1.3
    robot_height: 4.3
    min_turn_radius: 4.2
    nominal_speed: 1.0
    max_lateral_acceleration: 0.08
    max_step_height: 0.25
    max_slope: 0.30
    yaw_bins: 36
    primitive_length: 1.0
    search_resolution: 0.45
    max_nodes: 24000
  gridmap_global_planner: *astar
  octomap_global_planner: *astar
local_controller_server:
  # 0.1 s 与 MPPI 首个控制间隔一致。
  controller_frequency: 10.0
  local_planning_frequency: 2.0
  cubic_bezier_smoothing_enabled: false
  sensor_freshness_enabled: true
  sensor_freshness_topic: /points_raw
  sensor_freshness_timeout: 1.5
  localization_timeout: 1.5
  goal_height_tolerance: 0.5
  progress_checker_timeout: 30.0
bt_navigator:
  goal_odom_topic: /odom
  goal_imu_topic: /livox/imu_raw
  goal_height_tolerance: 0.50
  default_server_timeout: 15000
